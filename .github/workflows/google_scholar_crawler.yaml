name: Get Citation Data

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google_scholar_crawler.yaml'
      - 'google_scholar_crawler/**'

permissions:
  contents: write

concurrency:
  group: google-scholar-citation-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test snapshot preservation and error handling
        run: python -m unittest discover -s google_scholar_crawler/tests -v
      - name: Install requirements
        run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Fetch citation data
        id: citations
        working-directory: google_scholar_crawler
        run: python main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
      - name: Check out citation history
        if: steps.citations.outputs.refreshed == 'true'
        uses: actions/checkout@v6
        with:
          ref: google-scholar-stats
          path: scholar-stats
      - name: Publish refreshed citation data
        if: steps.citations.outputs.refreshed == 'true'
        run: |
          cp google_scholar_crawler/results/*.json scholar-stats/
          cd scholar-stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          if git diff --cached --quiet; then
            echo "Citation snapshot is unchanged."
            exit 0
          fi
          git commit -m "Update citation data"
          git push origin HEAD:google-scholar-stats
