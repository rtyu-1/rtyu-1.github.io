<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="#about-me" target="_self">{% if page.lang == 'zh-CN' %}主页{% else %}Homepage{% endif %}</a></li>
          {% if page.lang == 'zh-CN' %}{% assign navigation = site.data.navigation.zh %}{% else %}{% assign navigation = site.data.navigation.main %}{% endif %}
          {% for link in navigation %}
            <li class="masthead__menu-item"><a href="{{ link.url | relative_url }}" target="_self">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
